<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">360cube workflow</title>
  <desc id="desc">An equirectangular panorama is projected from the current camera observation point onto six physical cube faces and exported as six 2D outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <linearGradient id="sky" x1="0" x2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1200" height="460" rx="24" fill="url(#bg)"/>
  <text x="600" y="54" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" text-anchor="middle">360cube · 从球幕到六面 2D 输出</text>
  <text x="600" y="85" fill="#cbd5e1" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" text-anchor="middle">每个像素均沿“当前观测点 → 墙面点”的方向采样同一张全景图</text>

  <g filter="url(#shadow)">
    <rect x="55" y="133" width="250" height="225" rx="18" fill="#0f172a" stroke="#475569"/>
    <rect x="75" y="155" width="210" height="128" rx="10" fill="url(#sky)"/>
    <path d="M75 250C115 208 150 289 193 229C226 182 256 218 285 177V283H75Z" fill="#f59e0b" opacity=".88"/>
    <text x="180" y="318" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle">360 全景输入</text>
    <text x="180" y="341" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">图片 · 视频 · 序列帧</text>
  </g>

  <path d="M325 245H418" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="440" y="133" width="320" height="225" rx="18" fill="#0f172a" stroke="#475569"/>
    <path d="M525 188L617 144L709 188L617 234Z" fill="#334155" stroke="#a78bfa" stroke-width="2"/>
    <path d="M525 188V279L617 323V234Z" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <path d="M617 234V323L709 279V188Z" fill="#273449" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="617" cy="235" r="11" fill="#f43f5e"/>
    <path d="M617 235L570 187M617 235L662 187M617 235L617 323" stroke="#fda4af" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="600" y="318" fill="#f8fafc" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Cube0 + 当前相机</text>
    <text x="600" y="341" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">六个独立物理平面</text>
  </g>

  <path d="M780 245H873" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="895" y="133" width="250" height="225" rx="18" fill="#0f172a" stroke="#475569"/>
    <g font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#e2e8f0">
      <rect x="930" y="163" width="78" height="47" rx="6" fill="#0ea5e9"/><text x="969" y="192" text-anchor="middle">Front</text>
      <rect x="1025" y="163" width="78" height="47" rx="6" fill="#14b8a6"/><text x="1064" y="192" text-anchor="middle">Back</text>
      <rect x="930" y="222" width="78" height="47" rx="6" fill="#f97316"/><text x="969" y="251" text-anchor="middle">Left</text>
      <rect x="1025" y="222" width="78" height="47" rx="6" fill="#ec4899"/><text x="1064" y="251" text-anchor="middle">Right</text>
      <rect x="930" y="281" width="78" height="47" rx="6" fill="#8b5cf6"/><text x="969" y="310" text-anchor="middle">Top</text>
      <rect x="1025" y="281" width="78" height="47" rx="6" fill="#eab308"/><text x="1064" y="310" text-anchor="middle">Bottom</text>
    </g>
    <text x="1020" y="341" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" text-anchor="middle">PNG · PNG 序列 · MP4</text>
  </g>
  <text x="600" y="414" fill="#94a3b8" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" text-anchor="middle">输出目录：Assets/StreamingAssets/360TurnTo2D/&lt;时间戳&gt;/</text>
</svg>
